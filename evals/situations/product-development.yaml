  authority:
    ladder: true
    fingerprint: sha256:a840e099da882807
    means:
      none: The person or group doing it can just proceed; nobody else has any reason to be consulted
        or informed beforehand, because it touches nobody else's say or interests.
      discretionary: Others are affected or might like a say, so checking with them beforehand is a considerate
        step, but it may be dropped, and proceeding unannounced breaks no rule, agreement or law.
      notify: Another party must be informed beforehand, because a rule, agreement or law says so, but
        they have no power to stop it, so once informed the doer may proceed even over their objection.
      approve: A particular person or body, such as a manager, client, committee, landlord or co-owner,
        must agree beforehand because an agreement, role or house rule gives them that say, and they can
        stop it by saying no.
      statutory: The law itself sets the condition, so a permit, licence or legal consent must be granted
        beforehand, by an official body or by a person the law names, and proceeding before it is granted
        is unlawful.
