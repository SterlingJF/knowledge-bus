# The smallest universe that conforms: one frame, one element, one artifact
# that hosts it, and the required-but-empty collections.
universe:
  id: universe-predicate-names-factor
  label: Minimal
  version: 0.1
  conforms_to: kbp/0.6
  ordering_frame: stage

statuses: [conjecture, measured]

frames:
  - id: stage
    code: fa1a1
    role: ordering
    set_by: universe
    attaches_to: element
    values:
      - { id: only, question: "Where in the sequence does this sit?" }

factors:
  - id: team-shape
    code: kc1c1
    question: "Who is doing the work?"
    set_by: instance
    values:
      - { id: solo, question: "Is one person accountable?" }

empty_composition:
  when: { team-shape: [solo] }

relation_kinds:
  - { id: informs, ordered: true }

elements:
  - id: the-question
    code: ea1a1
    question: "What is being asked?"
    stage: only
    cardinality: singleton

artifacts:
  - id: the-record
    code: aa1a1
    enablement: "Lets someone state a question and be held to it."
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core:
        - the-question

relations: []
