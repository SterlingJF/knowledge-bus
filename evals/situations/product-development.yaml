# The product-development universe's answers for the recognition check: for each set, the value
# each shared case in cases.yaml belongs to, labelled against the meanings below. Labelled blind
# on both sides; a case is kept only where both agree. Written by tools/evals/intake.py apply.
# Changing a meaning, or the universe's values, makes a set's answers stale until relabelled. The
# last apply kept 31 of 31. Answers per set: phase 36; time-separation 31; reversibility 19;
# uptake 19; authority 40; maturity 25; outcome.form 20; audience 28; outcome.replication 18;
# outcome.mutability 16. Status: development situations, interim.
schema: evals-answers/1
universe: product-development
field: product-development
frames:
  phase:
    fingerprint: sha256:0444344a02067e9f
    means:
      strategy: Knowledge about the direction and footing of the whole effort, such as what it stands
        for, the lasting change it aims for, how it pays its way and who funds it, how it reaches people,
        what it must own, do or rely on others for, what keeps it ahead of rivals, which tempting paths
        it turns down, which outside conditions bear on it, and whose approval or licence it needs.
      discovery: Knowledge gathered before any answer is chosen, about one problem and the people who
        have it, such as which groups it affects, how real, how big and how pressing it is, what those
        people use today instead, measurements of how things stand now, what they are trying to achieve,
        what could harm the effort or prove untrue, and predictions to test.
      design: Knowledge about the chosen answer and the choices behind it, such as what it lets people
        do, what is in, deferred or out, which options were weighed and by what criteria, what was decided
        and what would reopen it, the limits and requirements it must respect, the look and wording rules
        of its brand, how others handled similar problems, and questions still open.
      validation: Knowledge about checking results, such as the measures, targets and success conditions
        that show whether the answer delivers what it promised once people use it, the ranges those measures
        must stay within, and how each quantity is measured.
      architecture: Knowledge about the inside of the solution, such as what it is and is not responsible
        for, its components and what each one is responsible for, how they connect, what information passes
        between them, and the named categories it uses.
      operate: Knowledge for putting the result into use and looking after it afterwards, such as how
        it is rolled out and to whom first, who looks after it, the routines it needs and what to do when
        it breaks.
