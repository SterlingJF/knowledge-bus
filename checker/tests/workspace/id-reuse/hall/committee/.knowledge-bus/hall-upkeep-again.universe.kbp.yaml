universe:
  id: hall-upkeep
  label: Hall upkeep again
  version: 0.1
  conforms_to: kbp/0.8
  ordering_frame: upkeep-cycle
  overview:
    covers: The cleaning, checks and repairs that keep a village hall fit for each hirer.
    for: The hall caretaker, the management committee and the people who hire the hall.
    excludes: Booking dates, fees and deposits.

statuses: [proposed, agreed, retired]

frames:
  - id: upkeep-cycle
    code: f12r8
    role: ordering
    set_by: universe
    attaches_to: element
    values: [after-each-event, monthly, yearly]

  - id: done-by
    code: fzn8r
    role: applicability
    set_by: instance
    question: Who carries out the task?
    values: [hirer, caretaker, contractor]

no_artifact:
  when: { done-by: [contractor] }

relation_kinds:
  - id: feeds
    ordered: true
    phrasing:
      forward: Feeds
      reverse: Fed by

elements:
  - { id: hirer-cleaning, code: ejskz, question: "What must a hirer clean before handing the hall back?", upkeep-cycle: after-each-event, cardinality: singleton }
  - { id: fault-contact, code: eap7e, question: "Whom does a hirer call when something in the hall breaks?", upkeep-cycle: after-each-event, cardinality: singleton }
  - { id: safety-checks, code: e9ncs, question: "Which safety checks does the caretaker make each month?", upkeep-cycle: monthly, cardinality: singleton }
  - { id: deep-clean-dates, code: e3dah, question: "On which dates is the hall closed for a deep clean?", upkeep-cycle: yearly, cardinality: singleton }

artifacts:
  - id: hirer-checklist
    code: a99wg
    enablement: { action: "leave the hall ready for the next hirer", actor: hirer, timing: at the end of each event }
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core: [hirer-cleaning, fault-contact]
      situational: [deep-clean-dates]

relations:
  - { from: safety-checks, to: fault-contact, kind: feeds }
