# The codebase-recordkeeping universe's answers for the recognition check: for each set, the value
# each shared case in cases.yaml belongs to, labelled against the meanings below. Labelled blind
# on both sides; a case is kept only where both agree. Written by tools/evals/intake.py apply.
# Changing a meaning, or the universe's values, makes a set's answers stale until relabelled. The
# last apply kept 18 of 18. Answers per set: step 34; issue-kind 27; docs-task 39; contributor-
# assertion 18; repository-state 13; notes-writing 26; notes-place 18; commit-convention 18;
# version-pattern 16. Status: development situations, interim.
schema: evals-answers/1
universe: codebase-recordkeeping
field: code-repository
frames:
  step:
    fingerprint: sha256:f2f6b29f9e177bcd
    means:
      choose: The person weighs the project from outside, such as whether to try the software, whether
        the licence allows a planned use, whom to pay, or which work the maintainers plan next.
      use: The person installs or runs the software and needs help with the software, such as installing,
        changing settings, fixing an error, or reporting a security hole privately.
      propose: The person takes part before a change exists, such as reporting a bug, asking for a feature,
        discussing a design, learning the rules for contributions, or reporting bad conduct in the project's
        spaces.
      build: The person writes or tests code in a local copy, such as setting up the tools, running the
        build and the tests, finding the right part of the code, or giving a coding agent its working
        rules.
      review: The person judges a proposed or past change, such as finding who must approve the change,
        deciding whether to merge the change, or reading why someone made an earlier change.
      release: The person publishes or passes on a version of the software, such as following the steps
        to publish a release, reading what a new release changes before upgrading, or adding required
        notices to a redistributed copy.
