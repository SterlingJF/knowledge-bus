name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialize releases, including different tags, so an older run cannot race latest.
concurrency:
  group: knowledge-bus-release
  cancel-in-progress: false

env:
  UV_MANAGED_PYTHON: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: uv sync --locked
      - uses: extractions/setup-just@v4
      - name: Verify tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python tools/release/release.py verify-tag "$RELEASE_TAG"
      - name: Verify release and build distributions
        run: uv run --locked python tools/release/release.py check --output "$RUNNER_TEMP/release-artifacts"
      - name: Generate complete release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python tools/release/release.py notes > "$RUNNER_TEMP/release-artifacts/release-notes.md"
          uv run --locked python tools/release/publish.py manifest "$RUNNER_TEMP/release-artifacts" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error

  native-hosts:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, pi, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release-artifacts
      - run: uv sync --locked
      - run: npm install --global @anthropic-ai/claude-code@2.1.226 @openai/codex@0.149.0 @earendil-works/pi-coding-agent@0.85.1 opencode-ai@1.18.20
      - name: Verify native CLI registration before publication
        env:
          TEST_HOST: ${{ matrix.host }}
        run: uv run --locked python tools/plugin/check_host_cli.py --host "$TEST_HOST" --artifacts release-artifacts

  publish:
    needs: [verify, native-hosts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release-artifacts
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Publish the GitHub release and npm packages through OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python tools/release/publish.py publish release-artifacts "$RELEASE_TAG"

  public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, pi, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release-artifacts
      - run: uv sync --locked
      - run: npm install --global @anthropic-ai/claude-code@2.1.226 @openai/codex@0.149.0 @earendil-works/pi-coding-agent@0.85.1 opencode-ai@1.18.20
      - name: Smoke-test public native installation
        env:
          TEST_HOST: ${{ matrix.host }}
        run: uv run --locked python tools/plugin/check_host_cli.py --host "$TEST_HOST" --artifacts release-artifacts --public
