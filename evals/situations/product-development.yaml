  time-separation:
    ladder: true
    fingerprint: sha256:e2f38ce8c63c68fa
    means:
      none: Nobody will later need to retrace why it was done this way, not even the person who thought
        it through; the thinking is used up in the moment.
      across-sessions: The furthest later reader is the same person who thought it through, coming back
        after hours, months or years; nobody else will need it.
      across-people: The furthest later reader is someone else inside the same circle, meaning the household,
        team, club or company that did the thinking, such as a housemate, colleague or successor; nobody
        outside that circle will need it.
      across-organisations: The furthest later reader sits outside the circle that did the thinking, such
        as a client, an auditor, another company or an unknown reader years on.
