# Test-only shared cases for the recognition tests. Invented.
schema: evals-cases/1
tags:
  kind:
    food: Something to eat or drink, made or sold.
    music: Something played or sung for listeners.
    craft: Something made by hand, shown or taught.
  who:
    one: One person whose stall or act it is.
    group: Several people running the stall or act together.
    organisation: A club, troop or other body acting as itself.
cases:
- id: c01
  text: A retired baker sets out flapjacks by the duck pond, and strollers help themselves for a coin in the tin.
  field: summer-fair
  tags: {kind: food, who: one}
- id: c02
  text: The brass band plays on the green all afternoon, and families drift over from the tea tent to sit on the grass.
  field: summer-fair
  tags: {kind: music, who: group}
