# A kbp/0.8 universe naming its own words: each term once, with one meaning.
universe:
  id: terms
  label: Minimal
  version: 0.1
  conforms_to: kbp/0.8
  ordering_frame: stage
  terms:
    - term: question
      means: "What an element's content answers, and the whole of its identity."
    - term: the record
      means: "The artifact that holds a stated question to account."

statuses: [conjecture, measured]

frames:
  - id: stage
    code: fa1a1
    role: ordering
    set_by: universe
    attaches_to: element
    values:
      - { id: only, question: "Where in the sequence does this sit?" }

no_artifact:
  when: {}

relation_kinds:
  - { id: informs, ordered: true }

elements:
  - id: the-question
    code: ea1a1
    question: "What is being asked?"
    stage: only
    cardinality: singleton

artifacts:
  - id: the-record
    code: aa1a1
    enablement: "Lets someone state a question and be held to it."
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core:
        - the-question

relations: []
