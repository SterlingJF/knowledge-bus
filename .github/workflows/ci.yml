name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_MANAGED_PYTHON: "true"

jobs:
  checks-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - uses: extractions/setup-just@v4
      - run: pnpm run check:fast
      - run: pnpm run check:plugins
      - run: pnpm run test
      - run: uv run --locked python tools/plugin/check_skills_install.py
      - run: uv run kbp --validate
      - run: uv run --locked python tools/plugin/check_native_install.py

  explorer-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:explorer:unit

  explorer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm run test:explorer:adapter
      - run: pnpm run build:explorer
      - run: pnpm run render:explorer
      - run: pnpm run test:explorer:browser
      - run: pnpm run check:explorer:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: explorer
          path: dist/explorer/
          if-no-files-found: error

  explorer-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm run build:explorer
      - run: pnpm run render:explorer
      - name: Capture KB Explorer snapshots
        run: pnpm run capture:explorer:step
      - uses: actions/upload-artifact@v7
        with:
          name: explorer-shots-step
          path: dist/explorer-shots/step/
          if-no-files-found: error

  checks:
    needs: [checks-static, explorer-unit, explorer-browser, explorer-shots]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every check lane to pass
        run: |
          test "${{ needs.checks-static.result }}" = success
          test "${{ needs.explorer-unit.result }}" = success
          test "${{ needs.explorer-browser.result }}" = success
          test "${{ needs.explorer-shots.result }}" = success

  native-hosts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, pi, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned native CLIs in the disposable runner
        run: npm install --global @anthropic-ai/claude-code@2.1.226 @openai/codex@0.149.0 @earendil-works/pi-coding-agent@0.85.1 opencode-ai@1.18.20
      - name: Build host fixture and test native commands
        env:
          TEST_HOST: ${{ matrix.host }}
        run: |
          uv run --locked python tools/plugin/plugin.py check "$TEST_HOST" --output "$RUNNER_TEMP/host-package"
          uv run --locked python tools/plugin/check_host_cli.py --host "$TEST_HOST" --artifacts "$RUNNER_TEMP/host-package"
