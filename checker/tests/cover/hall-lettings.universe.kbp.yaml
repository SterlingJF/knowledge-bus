universe:
  id: hall-lettings
  label: Hall lettings
  version: 0.1
  conforms_to: kbp/0.8
  ordering_frame: booking-stage
  overview:
    covers: Lettings a village hall arranges through an agent, from the first enquiry to the signed agreement.
    for: The lettings agent and the people who hire the hall.
    excludes: Cleaning and repairs to the building.

statuses: [enquiry, confirmed, completed, cancelled]

frames:
  - id: booking-stage
    code: fg2b3
    role: ordering
    set_by: universe
    attaches_to: element
    values: [enquiry, event, handback]

  - id: hirer-kind
    code: fvw5x
    role: applicability
    set_by: instance
    question: Is the hall hired by a regular group or for a single event?
    values: [regular-group, single-event]

no_artifact:
  when: { hirer-kind: [regular-group] }

relation_kinds:
  - id: feeds
    ordered: true
    phrasing:
      forward: Feeds
      reverse: Fed by

elements:
  - { id: event-date, code: ej49y, question: "On what date and between which hours does the hirer use the hall?", booking-stage: enquiry, cardinality: per-booking }
  - { id: hire-fee, code: ewe5h, question: "What fee does the hall charge for the booking?", booking-stage: enquiry, cardinality: per-booking }
  - { id: damage-deposit, code: ebpfx, question: "What deposit does the hirer pay against damage?", booking-stage: enquiry, cardinality: per-booking }
  - { id: key-return, code: ef0wm, question: "By what time and to whom does the hirer return the keys?", booking-stage: handback, cardinality: per-booking }

artifacts:
  - id: booking-form
    code: at9ky
    enablement: { action: "hold the hall for an event", actor: hirer, timing: before the bookings secretary confirms the date }
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core: [event-date, hire-fee, damage-deposit]
      situational: [key-return]

relations:
  - { from: hire-fee, to: damage-deposit, kind: feeds }
