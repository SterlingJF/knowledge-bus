    also be replaced.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-be86557
  text: A group that booked a village hall calls off its event inside the final fortnight and gets back
    only half the hire charge, where cancelling earlier would have lost it nothing.
  field: product-development
  tags: {kind: service, who: group}
- id: s-f9a4df6
  text: An owner who altered a protected historic property without consent can be served a notice, even
    years later, to restore its earlier condition, or to reduce the harm where that is impractical, all
    at their own expense.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-7ae9316
  text: 'A maintainer releases a library to a registry run as a permanent archive: that release can neither
    be overwritten nor deleted, and the most that can be done is flag it as withdrawn so newcomers steer
    clear while existing users keep working.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-afe76e6
  text: During routine maintenance an engineer deleted rows from a hosting platform's main database, and
    because the backups did not cover the gap, several hours of users' changes were lost for good.
  field: product-development
  tags: {kind: service, who: one}
- id: s-9b6a3be
  text: A researcher's preprint has already been publicly announced; withdrawing it only adds a new version
    flagged as withdrawn with a reason, while the earlier versions and full text stay readable.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-2d715ab
  text: A research team pulls a registered study plan from an online registry, which wipes its form and
    files and keeps only a public entry with the title, dates and reason; every administrator had to consent,
    and the platform warns there is no way back.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-7723de8
  text: A health service's patient newsletter goes out with every recipient's address in plain view, most
    showing full names, instead of hidden, and a regulator later fines the trust that runs it.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-e26fa02
  text: A researcher asks a natural history museum for a bone or feather sample from a specimen for genetic
    testing; the museum screens such requests strictly because sampling uses up part of a finite, unreplaceable
    collection.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-b1ccec7
  text: An archaeology team digs a site, and the digging itself permanently destroys the layers and the
    context of the finds, leaving only the team's records.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-92665f4
  text: Someone pulls a planning application back while the council is still checking that it is complete,
    and gets the whole fee returned; once the council has accepted it and opened it to public comment,
    pulling it back would forfeit the fee.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-0e91316
  text: A company that sells web addresses deletes one registered by mistake while still inside the short
    grace window that follows a new registration, and the registry credits back the whole fee; a few days
    later that fee would be spent for good.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-8a10565
  text: Every household must complete the national census, and those who ignore it get reminders and visits,
    and in the end can be taken to court.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-8022b23
  text: A code-hosting site told all its contributors to switch on a second login check by a set date,
    after which anyone who had not done so was locked out.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-570c6b7
  text: Flat owners must pay whatever service charge their lease sets for upkeep and insurance, though
    they can ask for a breakdown and challenge unreasonable sums.
  field: product-development
  tags: {kind: service, who: one}
- id: s-eb453a3
  text: A council moved every household to a longer cycle of rubbish collection to meet recycling targets,
    and residents could not opt out, though some households could ask for extra capacity.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-2a4cbc3
  text: Households are supplied with water by whichever company covers their address and cannot switch,
    while only businesses may pick another supplier.
  field: product-development
  tags: {kind: service, who: group}
- id: s-63da2d5
  text: Staff in health settings must complete set training on fire safety, infection control and safeguarding,
    with the content fixed nationally and the timing set by their employer.
  field: product-development
  tags: {kind: service, who: one}
- id: s-fa15be6
  text: A landlord must fit smoke alarms and a carbon monoxide alarm and keep the gas and electrics safe,
    and tenants have these without having to ask.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-f476466
  text: A tax agency trialled an online filing tool at no charge, stressing that the way each person files
    is up to them, and many thousands of taxpayers used it.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-054bd72
  text: Volunteers hold drop-in sessions at no charge, at which anyone with a broken toaster or lamp can
    mend it alongside them.
  field: product-development
  tags: {kind: service, who: group}
- id: s-4783303
  text: A university puts its course materials online with no sign-up, so anyone who wants to can browse,
    download and reuse them at their own pace.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-059adc7
  text: One developer maintains a command-line search tool under a permissive licence, with ready-built
    downloads for every release that anyone can install.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-9c66076
  text: Every autumn the health service makes a flu jab available at no charge to the elderly, carers
    and anyone at greater risk, who can book it or leave it.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-c97db3e
  text: A local charity gives private advice on debt, housing and benefits, at no charge, to anyone who
    asks.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-cde32ea
  text: Volunteers scan and proofread old books whose copyright has lapsed, free for anyone to download.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-73fa1d0
  text: 'A council sells an optional garden-waste service: a yearly subscription buys a bin and fortnightly
    collections, on top of the ordinary rounds.'
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-ea665b3
  text: A council sells optional advice before a planning application is lodged, with the price rising
    with the size of the scheme, and the advice is not binding.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-b112707
  text: A council leisure centre runs children's swimming lessons for a monthly direct-debit fee that
    also covers practice swims and badges.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-9c84464
  text: Readers of an independent newsletter who want more than its one free edition a week pay a subscription
    that brings extra updates and entry to a members' community.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-ad82ad9
  text: A part-time piano tuner charges per visit, more for long distances, and quotes separately for
    large pitch corrections.
  field: product-development
  tags: {kind: service, who: one}
- id: s-7d31dfd
  text: A trader whose side business earns less than the small yearly tax-free trading allowance generally
    owes the tax office no return or word about it and simply carries on.
  field: product-development
  tags: {kind: service, who: one}
- id: s-be3e256
  text: A developer copies an open code repository into their own account and starts changing it independently,
    never saying a word to its maintainers.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-be30caa
  text: A writer publishes a new piece and never files it with any copyright office, because it is protected
    from the moment it is fixed and filing is optional.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-a67382f
  text: A homeowner retiles the kitchen and fits new countertops, jobs the city lists as exempt from building
    permits, so there is nothing to apply for.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-28b9de1
  text: A friend of the family who babysits for a couple of hours in the evening has no childcare registration
    to make and can simply start.
  field: product-development
  tags: {kind: service, who: one}
- id: s-fa2a6aa
  text: A stranger reuses and reworks a picture that its maker has dedicated to the public domain, with
    no need to contact the maker at all.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-ba5184c
  text: A researcher analysing an openly available, de-identified dataset needs no ethics-board review,
    because the university's ethics office says such analysis is not research on human subjects.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-6ae1b20
  text: Residents hold a get-together on their own driveway and front gardens, with the road left open
    and no alcohol sold; the council's street-party guidance says such a private party needs no licence,
    and consultation only arises when a road is closed.
  field: product-development
  tags: {kind: service, who: group}
- id: s-a78a20d
  text: A landowner cutting wood for their own use on their land is exempt from the harvest form that
    commercial logging calls for, so no agency hears about it.
  field: product-development
  tags: {kind: service, who: one}
- id: s-229e071
  text: A university beekeeping guide recommends that a beekeeper with hives in a back garden have a friendly
    word with the neighbours unless the hives are well out of the way, while granting that some keepers
    hold off and respond to queries as they arise.
  field: product-development
  tags: {kind: service, who: one}
- id: s-b05538a
  text: A homeowner may cut a neighbour's overhanging branches back to the boundary on their own say-so,
    and the council merely recommends a word with the neighbour in advance; stepping onto the neighbour's
    land to do it would be another matter.
  field: product-development
  tags: {kind: service, who: one}
- id: s-a02bac4
  text: A building contractor may join an industry body's voluntary code under which sites keep nearby
    residents up to date and treat them courteously; joining and the updates are optional, and skipping
    them is not illegal.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-46081f1
  text: A council's building-control page says the regulations place no duty on a homeowner to give the
    neighbours word of planned building, and the council will not contact them either, though a courteous
    chat is advised.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-8fd30f3
  text: A reporter about to publish an investigation is urged by a professional ethics code to give its
    subject a fair chance to respond, but the code calls itself a guide that cannot be enforced.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-4a171e9
  text: A homeowner planning to cut into the wall shared with next door must serve written notice on the
    neighbour in advance; the neighbour can dissent, but that only sends the terms to surveyors and cannot
    forbid the job.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-455a7a5
  text: A parent who plans to teach their child at home sends the school district a letter of intent by
    the yearly deadline and may begin once it is filed; the district has no say in the matter.
  field: product-development
  tags: {kind: service, who: one}
- id: s-850f021
  text: A cook opening a small catering business from their kitchen must sign up on the council's food
    business list about a month before trading; it costs nothing and the council has no power to refuse.
  field: product-development
  tags: {kind: service, who: one}
- id: s-52c9dca
  text: Before digging in their garden, a homeowner is legally bound to phone the utility-locating line
    a few days earlier so buried cables and pipes get marked; the call seeks no one's yes to dig.
  field: product-development
  tags: {kind: service, who: one}
- id: s-08c13e3
  text: A woodland owner about to carry out a commercial timber harvest must file a form with the state
    forest service beforehand, and the form is expressly not a permit, so the service cannot block the
    cut.
  field: product-development
  tags: {kind: service, who: one}
- id: s-c9b5737
  text: A landlord who needs to get into a tenant's flat for a necessary repair must give a day's written
    warning naming a time in normal hours, and the tenant is expected to let them in.
  field: product-development
  tags: {kind: service, who: one}
- id: s-c01f0e0
  text: Volunteers on an open-source project cannot publish an official release until their project's
    committee has voted in favour of it; if too few vote yes, it is not published.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-1756498
  text: A contributor who wants a new feature in a programming language writes a design proposal, and
    only if the project's governing council accepts it may the change be built into the language.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-e851d58
  text: A substantial change to a programming language starts as a public design document, and it moves
    to its closing comment stage only after every member of the responsible sub-team has signed off.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-aeef2ac
  text: A volunteer who writes a script to make automated edits on a volunteer-run wiki must describe
    each task to the community's bot review group, which can turn it down, before the script may run.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-d1af880
  text: A researcher who wants a survey dataset that the archive holds under depositor permission must
    justify the project and wait for the original depositor to agree before downloading it.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-f138c16
  text: A hobbyist with a metal detector must get the yes of both the landowner and any tenant before
    searching a field or even a public beach, and either can simply refuse.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-7e9a38e
  text: A homeowner on a planned estate who wants to alter the outside of the house must submit the plans
    to the residents' design committee, which can refuse under the estate covenants.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-17ab42c
  text: A volunteer who wants to add a brand-new package to a community-run software collection begins
    by posting a public notice of intent so others can comment, but the package only enters the collection
    once its package-store keepers have reviewed it, and they can reject it.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-c264ee7
  text: Where a parent wants to teach their child at home, state law has the local school district sign
    off the plan in advance, and it may ask for changes or refuse; sending a letter of intent alone does
    not let lessons begin.
  field: product-development
  tags: {kind: service, who: one}
- id: s-e97b82d
  text: A landowner planning a very large clearcut must send the state forest service a harvest plan two
    months in advance and may not cut until the service has given its sign-off under the forestry rules,
    whereas smaller harvests only need a form filed.
  field: product-development
  tags: {kind: service, who: one}
- id: s-c27a39e
  text: A childminder who wants to be paid to look after other families' young children in their own home
    cannot take on a single child until the government inspectorate has enrolled them, which it can refuse.
  field: product-development
  tags: {kind: service, who: one}
- id: s-27e99e8
  text: A drug company planning a trial of a new medicine on volunteers may not start it until the government's
    medicines agency has reviewed and authorised the study.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-3edb519
  text: A photographer who wants to take paid aerial pictures with a small drone has to pass an exam and
    hold a pilot certificate from the aviation authority, and flying for clients with no certificate is
    illegal.
  field: product-development
  tags: {kind: service, who: one}
- id: s-11142e6
  text: A university lab planning experiments on live animals needs three government licences, for the
    building, the project and each researcher, before the opening procedure.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-e33915c
  text: A detectorist hoping to search a protected ancient monument needs a licence from the heritage
    body, plus the landowner's own separate agreement; searching with no licence is a crime.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-87da0c3
  text: A restaurant that wants to serve wine with meals must hold a premises licence from the local licensing
    authority before the opening glass is sold; neighbours can object while it is considered, but only
    the authority grants or refuses it.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-32121db
  text: A tree surgeon hired to fell a tree covered by a preservation order has to hold the council's
    signed clearance, since cutting it otherwise is an offence.
  field: product-development
  tags: {kind: service, who: one}
- id: s-1c74a3c
  text: A home cook who wants to sell food made in their own kitchen must send labels and a fee to the
    state agriculture department and may not sell anything until the permit is issued, and must apply
    again after moving house.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-892ca0b
  text: A driver who wants to carry paying passengers in their own car needs the car licensed by the council
    as a private-hire vehicle, and taking fares before that can lead to prosecution.
  field: product-development
  tags: {kind: service, who: one}
- id: s-22f3b88
  text: A developer planning a high-rise block of flats must get building-control sign-off from the country's
    building safety watchdog before any construction starts.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-cd879fe
  text: A national health body is designing a website where staff and the public look up and order vaccine
    leaflets; so far it has only interviewed users and has never put a clickable mock-up in front of them.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-8fbd4e1
  text: Two public health bodies are sketching one website where people can look up and apply for health
    volunteering roles; they have run surveys, interviews and paper mock-ups, but nobody has yet tried
    the whole journey end to end.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-8d135d7
  text: A county library has just begun letting adults take a few packets of seeds a month at a handful
    of branches, and is asking borrowers for tips and stories to shape a scheme with no results yet.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-a1f4ef8
  text: A lone developer kept spending months building apps nobody had asked for and launching them to
    almost no sign-ups; now he puts up a one-page advert first and builds only if enough strangers respond.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-d38ce02
  text: For six months a council is letting residents turn up without booking at one recycling centre
    on quiet weekdays, to see whether that helps; booking still applies on busy days, and nothing has
    been reported yet.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-669e5d0
  text: A county council is paying for an hourly bus between two towns and several villages for one year,
    and whether it stays depends on rider numbers nobody can know yet.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-001f15c
  text: An open-source infrastructure project ships each new feature switched off by default and marked
    experimental, possibly buggy and liable to change or vanish, for use only in short-lived test setups,
    before anyone relies on it.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-87a81c3
  text: A research team plans a small trial of a single nurse-led counselling talk for people admitted
    to hospital after poisoning themselves, mainly to learn whether such a trial can be run at all before
    testing whether the talk helps.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-de2e049
  text: A volunteer repair group has met once a month, mostly at one community house, for about twelve
    years, mending thousands of items for thousands of visitors, and a new city grant keeps it steady.
  field: product-development
  tags: {kind: service, who: group}
- id: s-c818bd8
  text: A council blocked one residential junction to through traffic with posts for a six-month experiment;
    traffic on the street dropped sharply, more people walked and main-road trips slowed by only seconds,
    so officers recommended keeping it for good.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-dafa654
  text: After a year at a magazine, a writer went freelance and followed where the enquiries were, into
    web writing paid on monthly contracts; from two or three clients in the first year, the business now
    turns over enough to need help with the accounts and has three regular writers.
  field: product-development
  tags: {kind: service, who: one}
- id: s-c013995
  text: A pilot shared community fridge in one small town ran for seven months and passed on thousands
    of food items, enough to show the idea holds up there.
  field: product-development
  tags: {kind: service, who: group}
- id: s-e7dea9c
  text: About forty volunteers drive older people to appointments and visits in their own cars; the scheme
    has won a national volunteering award, riders say it helps them stay independent, and it carries on,
    adjusted over time by riders' feedback.
  field: product-development
  tags: {kind: service, who: group}
- id: s-2de5093
  text: A council closed roads outside four schools at school-run times, saw more families leave the car
    at home and most parents ask for it full-time, so it kept the closures there and began trials at two
    more schools.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-52692bf
  text: A police force trialled trained volunteers checking vehicle speeds in a few small areas, and once
    it paid off rolled the scheme out across its whole region within months.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-bf806d1
  text: After a catch-up teaching method had succeeded elsewhere for years, an education ministry tried
    three versions in eighty schools with an outside check, then planned to take the chosen one to some
    eighteen hundred schools over three years.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-e06173d
  text: A national health agency began testing sewage for disease at a few hundred sites and within two
    years had over a thousand, covering almost half the population, while striving to keep sampling and
    lab methods comparable.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-5d20421
  text: A charity whose remedial-learning programme had succeeded in a much smaller earlier trial set
    out to take it to tens of thousands of villages across four states, while an outside team ran a second
    trial of the enlarged programme and checked the charity's own figures.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-55cf836
  text: A sample job description for a small charity running a programme at several sites asks its new
    head to draw up a national expansion into new areas, build ties with funders and community leaders
    at each new site, and publish the local programme's results as an example to repeat across the country.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-360c69e
  text: After road closures at drop-off time outside three schools took a couple of hundred children out
    of cars, a borough council proposed extending them to twelve schools in two phases.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-42e31b0
  text: A government trial gave international postgraduates a lighter visa process and extra help in finding
    jobs, starting at four universities; after its first stage was judged a success it was widened to
    over twenty more.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-d13ec30
  text: A charity that trialled one community fridge in a town now helps groups elsewhere open their own
    with guidance, donated fridges and peer support, as openings climb towards a target of over two hundred.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-d63326c
  text: A government has finished paying a regular no-strings income to young people leaving care, and
    so far has only their own and their workers' accounts of how it went; the comparison with similar
    young people who did not get the money, which will show whether it helped, is due next.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-23b6f58
  text: A drug company has finished signing up patients for the final large trial of a daily pill meant
    to cut dangerous blood-sugar lows in people who rely on insulin; its safety and benefit are not yet
    established, and the first results are expected within the year.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-bd0868f
  text: A transport department paid for uniformed safety patrols on buses and trains in a few areas; by
    the end of the trial, passengers felt safer in some areas but not in others, and the evaluators said
    a longer study was needed before any firm verdict.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-baac0ed
  text: A city council had a contractor build a long footbridge for walkers and cyclists over a river,
    which was officially opened to the public and stays in daily use long after the builders left.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-56d550b
  text: Seven families on modest incomes spent about a year building their own houses together, each labouring
    on the others' homes under a supervisor, and nobody moved in until every house was done.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-028b619
  text: Nearly a hundred company volunteers, with a play charity and a housing co-op, put up a new playground
    in one day from drawings by the co-op's children.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-5bbc5fe
  text: A town council planted a community orchard on borrowed land with grant-funded trees, held an official
    opening, and left it for residents to enjoy for years to come.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-3ff908b
  text: A cabinet maker spent over a decade building a large three-deck boat in his backyard from an online
    plan, doing all the woodwork himself, so he could one day sail it away.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-42c5c2b
  text: A council brings a hot midday meal to older or unwell people who struggle to cook, and the staff
    check they are comfortable and safe and help plate the food if needed.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-ca7026a
  text: A county library drops chosen books at the doors of housebound residents every four weeks, and
    a small team phones isolated residents for a chat and a welfare check.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-30cbe0b
  text: About forty volunteers use their own cars to drive older people door to door to medical appointments,
    shops and social visits, for a small yearly fee and a mileage rate.
  field: product-development
  tags: {kind: service, who: group}
- id: s-48c3c0d
  text: A sole trader cleans homes and businesses for paying clients, visit by visit.
  field: product-development
  tags: {kind: service, who: one}
- id: s-332b784
  text: A charity matches a volunteer to visit a lonely, housebound older person at home each week for
    company, small practical help and short outings.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-bbec40b
  text: A self-employed driving instructor with a dual-control car teaches learners on the road and can
    go with them to their test.
  field: product-development
  tags: {kind: service, who: one}
- id: s-578fe78
  text: Skilled volunteers, including retired engineers and sewing and bike menders, repair visitors'
    broken belongings for free at a monthly session in a community house.
  field: product-development
  tags: {kind: service, who: group}
- id: s-acc3798
  text: A council runs a free community bus between a village and a nearby town a couple of times on most
    weekdays, stopping at a country park, a supermarket and a community hospital.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-eb016ad
  text: Council officers inspect cafes, takeaways and care homes for how food is handled and how clean
    they are, then give a hygiene score from zero to five that is posted online for diners.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-2ff6765
  text: A water company tests thousands of samples a year for regulated substances and tells customers,
    in a yearly report, where their water comes from and that it meets health standards.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-16ad40a
  text: An independent expert is asked for a written opinion in a court case on a technical matter beyond
    the court's own knowledge, setting out facts, assumptions and reasoning that the judge and both sides
    rely on.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-e40ae78
  text: Four researchers pooled the results of some twenty controlled trials of treatments for young people
    who self-harm and concluded, with moderate confidence, that one type of therapy cuts repeat self-harm.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-41e9a79
  text: Residents and school pupils, led by a small archaeology firm, dug two ruined buildings at an abandoned
    settlement and concluded that a sizeable, fairly well-off community lived there centuries ago, though
    the dating was weak.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-06301e4
  text: A national statistics office surveys randomly chosen households about jobs, training and health,
    and publishes the official employment and unemployment figures that government relies on for policy
    and funding.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-d48339a
  text: A university, a state wildlife agency and partners had volunteers set trail cameras across a whole
    state for three years, then had experts check the species in the photos, and concluded the volunteer
    method was a reliable, cheaper way to record wildlife.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-411a69c
  text: A vegetable grower jots down what she sowed, where, and when, plus pests and yields, so that next
    spring she can time her sowings and rotate her crops.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-1733fa5
  text: Before a big decision, I put on paper the options I weighed, how likely I thought each outcome
    was and how I felt, so I can read it back later and see how my thinking held up.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-57cc568
  text: After every interview, a doctoral student sits in her car and scribbles raw impressions and half-formed
    ideas before they fade, to draw on for her own analysis later.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-96357dd
  text: A programmer keeps a daybook of what she did, what she learned, quick sketches and the values
    she saw while debugging, as a better memory than her own.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-2224d16
  text: A runner records each outing with the weather, the ground underfoot and how it felt, so that years
    on he can compare one winter with another and spot what led to an illness.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-f248260
  text: A gardener keeps a binder of bed layouts, soil results, planting and harvest dates, and goes through
    it over winter to decide what to grow more of and which seeds to reorder.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-1a2347e
  text: After an outage, the engineers write up what happened, why, and what will change, and it goes
    round the company's engineering staff for everyone to learn from.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-ec49a51
  text: When one shift hands over to the next, the outgoing operators leave a written log of the plant's
    state and the jobs in progress for the incoming crew.
  field: product-development
  tags: {kind: service, who: group}
- id: s-b8e6f3b
  text: Before writing any code, a few engineers draft a design document of their approach and the trade-offs,
    and pass it to teammates and senior colleagues in the same company for comment.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-fca66f3
  text: The minutes of a charity's general meeting record the decisions taken and the full reasons for
    them, and are made available to its trustees and members.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-1fca19f
  text: A development team writes its plan for the next two weeks for itself, keeps it up to date, and
    refines it at the end of each cycle in light of how the team worked.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-c2c992d
  text: At move-in, a landlord records the contents and condition of the flat in a list, walks through
    it with the new tenant, and has the tenant sign it, so it can settle a dispute over the deposit.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-285fc19
  text: A university team holding a research grant must send its funder a yearly account of what the project
    has achieved, or the money can be stopped.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-eed6439
  text: A sole-trader plumber sends a customer an invoice stating what is owed and by when.
  field: product-development
  tags: {kind: service, who: one}
- id: s-960e1ec
  text: At the close of the early design stage, an architecture team gives its paying client a report
    with the concept, an outline specification and a cost update for sign-off before detailed work begins.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-c54d7c8
  text: A wedding photographer sends a couple a contract covering what they will get, the turnaround,
    the deposit and balance payments, and what follows if the date is changed or dropped.
  field: product-development
  tags: {kind: service, who: one}
- id: s-d5c9cdd
  text: When a web project ends, the agency hands the client who commissioned it the code, logins and
    a readme explaining setup, deployment and who to contact for support.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-6889084
  text: A registered charity must file a yearly return with the body that oversees charities, attaching
    its accounts and declaring that every serious incident has been reported.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-c5b761d
  text: A company that trades nothing at all still has to confirm to the companies registry once a year
    that its listed details are right, or face a fine and possible removal.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-b40e64c
  text: After a data breach that could put people at risk, an organisation has a short window to tell
    the data-protection authority what went wrong, who might be hit and how it is responding.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-3f3fc79
  text: A medical device maker must send the national medicines and devices authority a submission showing
    its device is equivalent to one already sold, and may not sell until clearance comes back.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-e1cff4b
  text: A homeowner who wants to build an extension applies to the local planning authority, because building
    without permission can end in an order to tear it down.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-6c58ce1
  text: A freelancer whose earnings had no tax deducted up front reports them to the tax authority in
    an annual return, with interest and penalties if late.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-267c5f7
  text: After a short worldwide outage, a company publishes on an open blog what caused it, why the fix
    was slow and what it changed, meant for customers and engineers everywhere.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-b7f3dff
  text: Before collecting data, a researcher lodges a time-stamped plan of hypotheses and analyses in
    an open repository, so any reader can later tell planned work from exploratory work.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-9740c74
  text: A home cook puts her recipes and technique tutorials on her own website for any cook who happens
    to find it.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-9b2333d
  text: A council posts a news item on its website explaining a change to rubbish collection, who is exempt,
    and how residents' views will be heard, for any resident or visitor to read.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-c1af13c
  text: When a planning application comes in, the authority puts up site notices and posts it on its website
    so that anyone at all can comment during the consultation period.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-8b7577a
  text: A park agency had a tall old lighthouse, left close to the surf by erosion, jacked off its base
    and rolled far inland on rails over a few weeks, after moving the keepers' houses first.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-ae5ff64
  text: A bride had one dressmaker design and sew her wedding gown from scratch, blending two vintage
    styles, using her measurements, a plain linen trial version and a photo of the nearly finished gown.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-6feb887
  text: A national rail accident investigator looked into why a passenger train came off the tracks after
    weekend track maintenance, found a length of old rail left behind and a misunderstood inspection,
    and made recommendations.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-1e1857a
  text: Churches and mental-health workers, with an arts centre, had two local artists design a paint-by-number
    mural for one wall, which dozens of residents then painted over several weekends.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-af79b65
  text: Dozens of volunteer mountain rescuers searched a mountain in poor weather for a walker reported
    overdue, found him injured in a ravine after a day and a night, and carried him out on a stretcher.
  field: product-development
  tags: {kind: service, who: group}
- id: s-b908ab8
  text: A town committee had its old brick lighthouse lifted on jacks and pushed along steel rails some
    way back from a crumbling cliff edge, paid for with donations and grants.
  field: product-development
  tags: {kind: service, who: group}
- id: s-06d09e8
  text: A small brewery made its beers in batches of about twenty barrels, each brew taking six to eight
    hours, turning out roughly the same amount every week from its own recipes.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-36e5330
  text: A potter spent a few days making a fresh lot of stamped mugs to restock for craft fairs, throwing
    every body first, then stamping them, adding handles and firing them twice.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-6cdc2c5
  text: A small professional theatre company takes two or three shows a year round village halls and community
    centres, mostly playing one night in each place before moving on in its truck.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-b3ebd53
  text: Every newborn is offered the same heel-prick test at about five days old, with a few drops of
    blood put on a card and sent to a laboratory that checks for a set list of rare conditions.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-89c107e
  text: Volunteers from a river association test the water at twenty sites along a river and its streams
    every month for nutrients, bacteria, oxygen and acidity, and publish each year's results.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-958695f
  text: A sports centre runs the same one-day workplace first aid course, with hands-on practice, classroom
    sessions and an assessment, on about a dozen dates in a single season, charging each attendee.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-d2a014c
  text: A tutor recorded thousands of short maths and science lessons almost entirely by himself and put
    them online free, where learners around the world watch them.
  field: product-development
  tags: {kind: service, who: one}
- id: s-13f16c2
  text: Teachers recorded hundreds of lessons a week for an online classroom during school closures, and
    in its first term pupils took millions of lessons from it at no charge.
  field: product-development
  tags: {kind: service, who: group}
- id: s-d61be7a
  text: A self-taught teenager built phone apps on his own, such as a grade-average calculator and a typing
    game, kept them free to install, and passed a million installs within a few years.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-5fe4118
  text: A national statistics office opened an online tool that lets anyone build their own tables from
    its anonymised census figures, with automatic safeguards so no individual can be picked out.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-415d3c1
  text: After years of fieldwork by thousands of volunteer birdwatchers, a research charity put the resulting
    distribution maps online for anyone to view free, alongside a printed book.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-889f611
  text: A sight-loss organisation designed a typeface with highly distinct letters and numbers for easy
    reading, and gives it away as a free download for personal and commercial use.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-8e7df19
  text: Researchers found that the codes for two infection-prevention methods had been swapped at one
    hospital in their published trial, so they asked the journal to withdraw the article and print a corrected
    replacement.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-0cfdcce
  text: A research group found a one-line coding mistake behind some results in its published cancer study;
    the journal chose to withdraw the paper, and the group reported the corrected figures in a separate
    letter.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-00c90ce
  text: A poet found that dozens of lines of one poem were missing from her newly printed book, though
    her proof had been right; nothing could be done until the copies sold out and a corrected new edition
    was printed.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-ced0fb2
  text: A toy company recalled light-up headbands and toy pet cages because children could open the battery
    compartments, telling buyers to throw them away and send a photo for a full refund.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-ee9ced6
  text: A game developer on his own put out another free numbered patch for his title, repairing bugs
    and adjusting items for people who already own it, on computers and phones first and consoles later.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-5dd70d4
  text: Engineers sent a software patch up to probes already far out in space to stop a recurring computer
    glitch, and changed how often they fire their thrusters.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-8840345
  text: A small team of volunteer editors kept a world list of bird species and their names, revising
    it twice a year with new species, name changes and reclassifications, until a last version.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-f09e5a0
  text: A free operating system project announced another round of corrections to its stable release,
    mostly security repairs, which machines already running it can pull in without reinstalling.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-b1c35a9
  text: A rail company retimed every one of its main-line trains from a set date in winter, a change four
    years in the planning, and asked passengers to check their times before travelling.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-e83f5ec
  text: A national statistics office publishes monthly, quarterly and yearly estimates of economic output,
    and revises earlier figures at stages announced a year ahead as fuller data come in.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-dde1a35
  text: An international team kept a health research review open for two years, searching for new studies
    every month and publishing three full revisions whenever set triggers were met.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-836f127
  text: A large shopping website pushes changes to its live site about fifty times a day through an automated
    pipeline, with many small changes, close monitoring and chat-based coordination.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-d6c6326
  text: A bank's engineers push changes to its live systems more than a hundred times a day, each needing
    just one review, relying on automated checks and monitoring rather than batching changes up.
  field: product-development
  tags: {kind: service, who: group}
- id: s-1bba769
  text: A volunteer-built online map takes edits straight away and shows them within minutes, and its
    makers say it can never be complete because roads and buildings keep changing.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-5995b98
  text: 'A solo maker of paid websites skips any test server: one key press sends each small fix live
    within seconds, many times a day.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-00beddc
  text: A national environment agency publishes river level readings and a flood warnings list on the
    web, the warnings refreshed every quarter of an hour and readings taken about as often.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-f9d51fd
  text: A shell user compares prompt themes and reads that one stays minimal and quick, shows the branch
    and unsent commits, and turns its symbol red after a failed command. They are weighing if it is worth
    a try.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-be9029e
  text: A person who depends on a free scripting tool for automating desktop chores wants to send money
    to its creator. They find two pages where the lead developer receives sponsorship and tips.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-8046e13
  text: A curious person looks at an experimental trading program driven by artificial intelligence and
    reads its warnings before trying the program. It exists only for learning, places no real trades and
    offers no investment advice.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-ab83d06
  text: A company plans to offer a storage service built on an open object store. It reads the store's
    copyleft licence, written for networked server programs, to check if its intended use is allowed.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-92591cc
  text: A platform team is considering a database operator for their clusters. They check its public plan
    to see which major features the core contributors intend to tackle next and how those items get ranked.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-6d32a22
  text: A company that relies on large language models weighs adopting an open evaluation framework. It
    notes that it could create private checks from its own data, but using them costs money through a
    paid key.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-078ddb4
  text: A company that operates database servers is setting up a backup and recovery manager. It figures
    out which of the four packages go on which machines and checks the operating system and module requirements
    first.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-b2a4bcd
  text: A person who uses a proxy that gets past a website protection service finds a security flaw. Seeing
    that only the newest version is supported, they want to alert the developers privately through the
    advisory button.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-3ae2a77
  text: A household hosting its own control server for a private mesh network needs to know where the
    server looks for its settings file. They also want to point it at another location and check the file
    is valid.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-753f51e
  text: A company tries a monitoring system for the first time. It downloads the latest version, unpacks
    it and creates a basic settings file so the server collects metrics about its own health.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-805e5fb
  text: A first-time contributor to a fast terminal emulator wants to suggest an improvement. They learn
    they must first post a request, in their own words, asking to be vouched for before any pull request
    is allowed.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-e8e2a8d
  text: A team offering a text messaging interface drafts a proposal for an interface description standard.
    They argue the standard should be able to describe incoming event notifications arranged outside the
    interface, which the current version cannot describe.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-adff1f5
  text: A team behind an agent evaluation framework drafts a design proposal in which a second agent plays
    the user. The design would let agents be judged in back-and-forth conversations instead of with one
    upfront instruction.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-d4006ac
  text: A person whose push notifications fail on one service opens a bug report for a notification library.
    They fill in what happened, how to reproduce it, their versions and system, and logs with secrets
    removed.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-e35a301
  text: An organisation whose staff join the channels of a cloud gateway for web services reads the foundation's
    conduct rules. It wants to learn what behaviour is expected on the mailing lists, issue trackers and
    chats.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-26b9f49
  text: A company wants a new feature in an open observability tool for agents. It learns it should first
    open an issue to discuss any significant idea, because proposals nobody talked over may be turned
    down.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-edd8071
  text: A developer clones a generator that makes client libraries from interface specs and compiles it
    from source. They set up the needed language runtime and dependency manager, or do everything inside
    a container instead.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-527bdec
  text: A group of contributors to a set of fast compiler tools for web scripts studies the architecture
    overview. They want to find the layer for their edits, such as the parser or the shared memory arena.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-826956a
  text: The organisation behind a cluster policy engine prepares a guidance file for automated programming
    agents. It describes the engine and shows which folders hold the controllers, the command-line tool
    and the core logic.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-22e9abc
  text: The company maintaining a messaging broker gives automated programming agents written instructions.
    They explain how to compile the server and run its suites, use static analysis checks and find which
    component directory holds each plugin.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-2d84d07
  text: A developer on a containerised network tunnel client sets rules for an automated programming agent.
    It must make small, targeted edits, ask before breaking anything users depend on, update checks when
    behaviour shifts and use descriptive variable names.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-6c414af
  text: A team adding a field to a cluster monitoring operator wants fast feedback. They learn which check
    suites exist and extend a small isolated unit check instead of setting up a whole cluster.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-a2d8232
  text: A product analytics company maintains an ownership file that maps each area of its repository
    to the team that must approve edits. Every edit to the ownership rules therefore has an assigned reviewer.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-8889e29
  text: The people who run a customisable shell prompt judge incoming pull requests with a template. It
    asks which systems each submission was tried on, if artificial intelligence helped, and if the author
    understands what they contributed.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-169e611
  text: The team behind an evaluation and tracing platform for language model apps assesses pull requests
    through a form. It asks for the kind of edit, a linked issue and proof that the author checked their
    own submission first.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-9497bc1
  text: The organisation behind a service mesh holds a list showing which expert group must sign off on
    edits in each directory. From the list, contributors learn who must approve their networking or security
    edits.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-da91d1e
  text: A contributor to a command-line fuzzy finder opens a pull request and checks the ownership file.
    They find that a single person is responsible for approving every file in the repository.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-73af717
  text: The people who look after an authenticating reverse proxy judge pull requests before merging.
    They check that each pull request adds a changelog entry, has signed-off commits, comes from a feature
    branch and includes automated checks.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-fda43ad
  text: A person who looks after a database migration tool ships a new version. They merge a version bump,
    then create a tagged entry with notes on the hosting site so automation compiles the binaries and
    pushes out the packages.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-dd5f57c
  text: A company shipping its own version of a cloud gateway for web services must include the foundation's
    notice. The notice gives the copyright line and says the product contains material developed by that
    foundation.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-014e641
  text: An operations team that monitors its clusters reads the history of updates before upgrading. They
    see that a recent version raises dashboard memory limits and adds an optional metrics server and an
    alternative dashboard tool.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-1e49e26
  text: A household that uses a network ad blocker reads the notes for a new patch version before upgrading.
    They learn it fixes a serious flaw that let a service account on the same machine gain full administrator
    rights.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-ceaf874
  text: The foundation behind a monitoring system posts a schedule of upcoming early preview versions,
    which come out every six weeks. It also names the volunteer who will shepherd each version series.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-c2900a7
  text: A writer who checks documentation with a prose linter reads what a new version brings before upgrading.
    They find it adds a built-in runner for checking rules, so each style rule can carry its own sample
    cases.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-15829c2
  text: A writer using an offline grammar checker inside a note-taking app sees an error after a few clicks.
    She lists the steps that trigger it and what she expected instead, and attaches screenshots.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-df33246
  text: A man runs a self-hosted messaging server in a container behind a reverse proxy. The web interface
    misbehaves on the newest version, so he writes down what he did, what he expected and what showed
    up instead.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-c665339
  text: An operations team finds their monitoring server and alert manager doing something other than
    they expected. They write down steps to reproduce the problem, their version output, their settings
    with secrets removed, and the relevant logs.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-35ea917
  text: A developer notices that his customizable shell prompt behaves wrongly in his terminal. He writes
    down how it acts now and how it should act, plus his shell and system versions and his prompt settings.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-ba78765
  text: A small team hosts its own passkey sign-in service in containers and finds it acting wrongly.
    They walk through the steps that trigger the problem and note the version, the database and the log
    output.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-497a040
  text: After checking the guides and existing tickets, a company using a policy-as-code tool asks the
    project's developers to support a new capability. It describes its problem, the solution it wants
    and the alternatives it considered.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-1925628
  text: A home user who runs a virtual private network client in a small container asks its developers
    to add a new capability. He describes what he wants and lists references and things he has already
    tried.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-e37f84e
  text: A writer checks her prose with a markup-aware linter. After searching the backlog for duplicates,
    she asks the project's developers to improve an existing function and describes exactly what she wants
    it to do.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-6c4e96c
  text: A group of hobbyists runs its own control server for a private network. They propose a new capability,
    explain their use case and what should change, and offer to write the design and help implement the
    capability.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-140bfb7
  text: A company monitors its cluster and cloud spending with a cost-monitoring tool. It suggests an
    idea to the project's developers, explaining the frustration behind the idea, the solution it wants
    and the alternatives it has weighed.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-9629516
  text: A company relying on a cloud-native gateway notices that one page of the guides leaves out how
    a certain programming interface behaves. The company describes the current text of the page and the
    wording the page ought to have.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-042db2a
  text: A team using a dev data platform proposes an update to the project's main readme. They explain
    which part of the written guides is affected and what should change, adding screenshots to show the
    problem.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-e423c93
  text: A database team running a cluster operator for a popular database finds its manual frustrating.
    They propose adding new sections and changing certain pages, and they link to the existing pages they
    mean.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-0dae801
  text: A developer finds a page on a testing framework's website confusing. She explains what she thought
    it meant and how it turned out to mean something else, then suggests clearer wording for that page.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-ea3a468
  text: An organisation using a set of routing and load-balancing interfaces suggests improving the project's
    written guides. It explains what it would like added and why the change is needed.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-a0fb459
  text: A note-taker uses a query tool for plain-text notes. She links to a section of the manual she
    finds unclear, describes what confuses her, and proposes complete sentences of better wording.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-34b59e3
  text: A hobbyist using a push notification library asks the project's developers for help setting it
    up. He lists the library version, his operating system and how he installed the library.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-5af7e99
  text: A team wants help setting up a ready-made monitoring bundle for their container cluster. The project
    sends them to its discussion forum and chat channel to get support.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-efac654
  text: A company checks the website's guides first, then asks for help configuring a monitoring operator
    on its container cluster. It shares its operator version, its cluster type and how it installed the
    operator.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-d262751
  text: A person setting up a passkey sign-in provider asks how to do one particular thing with the provider.
    He gives as much detail as he can after confirming nobody has asked the same thing before.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-47adc70
  text: A person using a free accounting program creates a general help ticket asking how to use part
    of the program. She keeps the ticket apart from bug tickets and ideas for new capabilities.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-1ad3db4
  text: A team using a dev data platform asks the project's developers for help using one module. They
    attach screenshots and extra context to explain what they are trying to do.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-9a4b0b3
  text: A product analytics company keeps an internal template for each sprint, listing past incidents
    and unscheduled follow-ups. Every team then fills in its support hero, its absent members, quarter
    goal status, a retrospective, and high and low priority items.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-c9ac8e4
  text: The core team of a developer portal framework records a maintenance chore that needs special care,
    such as a tricky version update or migration. They describe what must be done and explain its priority
    and impact.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-1743681
  text: The core team of a telemetry collector distribution creates a ticket for its next version. It
    records the version number, a target date for the candidate version, a date for the stable launch
    and, optionally, a link to a related change.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-85e0434
  text: The core team of a tool that configures outside name servers from cluster resources starts a checklist
    for their next version. They will tag the version, promote the image, update manifests, then announce
    the version in chat.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-8ca5957
  text: Developers of a to-do management plugin for a notes app record an internal refactoring change.
    They explain why the refactoring is needed, which files must change and how they intend to test the
    refactoring.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-cfc8194
  text: A company that backs up database servers reads which of four packages to put on its machines,
    which package is mandatory, and what operating system and helper tools each backup server needs beforehand.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-28d98d3
  text: A small team wants to run their own control server for a private network, so they download the
    recommended package, add it with the system package tool, then edit the server's configuration file
    and restart the server.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-1af4cb0
  text: 'A design team wants a text-to-diagram tool on their computers and weighs the options: a script
    that detects their system and can preview its steps, a package manager, a container, or building from
    source.'
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-82fdb45
  text: A company picks how to put a gateway for web interfaces on its servers, choosing between containers,
    a cluster chart, system packages, or a source build, and locks down the admin ports in the example
    setup before launching.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-112a1ff
  text: A team wants a workspace manager for many coding agents on their machines. They check which tools
    and versions are required, then pick between a package manager, a container, or building it from source.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-665e02b
  text: 'A household with spare computers follows a beginner walkthrough for a self-hosted file storage
    service: they download one program, write a simple initial configuration file, launch a single test
    server, and begin interacting with the server.'
  field: code-repository
  tags: {kind: service, who: group}
- id: s-fbe7c25
  text: Someone who has just opened a voice studio app follows numbered steps to make a new voice profile
    from a short recording, then types a sentence and plays back the speech the app generates.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-5536313
  text: 'A team wanting to try a database operator follows a practice walkthrough: they set up a small
    cluster on a laptop, deploy the operator, and launch a test database, knowing it is not for production.'
  field: code-repository
  tags: {kind: service, who: group}
- id: s-37c9141
  text: A small business new to a voice agent platform explains the booking assistant it wants, lets the
    platform build an initial conversation flow, and talks to the assistant through the browser without
    any phone line.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-3b4acc0
  text: 'A company curious about a workflow engine follows a quick trial: with a test cluster ready, it
    applies a minimal setup, submits a sample hello-world job, and watches it run to completion.'
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-dcf7373
  text: 'An organisation new to a monitoring system follows a hello-world tutorial: it downloads the server,
    writes a basic file telling the server to watch itself, runs the server, and tries some early queries
    and graphs.'
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-02ccd2c
  text: A company running containers on its laptops reviews which system privileges and hidden folders
    containers get out of the box, and how to add or remove them when launching or creating a container.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-b184821
  text: A developer using a memory tool for a coding assistant checks where its configuration files live,
    which source wins when values conflict, and the effect and default of each option.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-9bf4575
  text: A company self-hosting an agent monitoring service goes through every environment variable, noting
    which are required, which have safe defaults, and that it must create its own unique secrets and pick
    an email provider.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-8e36789
  text: A team placing a login gateway in front of their web apps reads how its options can be given by
    flags, environment variables or a file, the order in which those sources override each other, and
    what each option means.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-5ba42ea
  text: A programmer wants a script to watch a growing log file and react the moment a line contains a
    failure, so they read how to stream a running program's output line by line or through a callback.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-29bebba
  text: A web developer wants their app to answer a request right away and send a notification email afterwards,
    so they read how to attach a background job that runs after the response is returned.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-261f1f2
  text: An operations team wants their cluster monitoring to also watch two more of their app namespaces,
    so they follow a guide to add those namespaces and define service monitors for those namespaces.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-5cdc5c7
  text: 'A research company building benchmarks for computer-using agents reads how to write one challenge:
    declaring its variants, preparing the sandbox, adding an optional solver, and a scoring step that
    checks the outcome.'
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-58e0bb8
  text: A company wants visitors to sign in through an outside identity provider before reaching a backend
    app, so it follows a guide that registers a client, deploys a sample service, and applies a login
    policy at the gateway.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-2b99b93
  text: A team running databases on a container cluster reads how to take physical backups, choosing between
    a plugin for cloud storage or volume snapshots, and learning about log archiving and base copies.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-06be0a7
  text: A company's engineers check the reference entry for a container tool's run instruction, reading
    each flag one by one, such as memory size, environment values, process identity and name servers.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-ecc1e3e
  text: A team using an assistant agent from the terminal checks a reference of its shell instructions
    and global flags, each with a short description, like resuming a session, picking a profile, or skipping
    approval prompts.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-b3f3727
  text: A web developer opens the reference entry for the router class of a web framework to check its
    parameters, attributes and methods, such as those for each request type and for including other routers.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-d3eb939
  text: A note-taker writing small scripts inside a notes app checks a reference explaining each available
    method and what it takes and returns, such as fetching notes by tag or folder and drawing headers.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-fa0264a
  text: A developer scans an index of every operation an issue-tracking terminal tool provides, each with
    a one-line summary, to find the right one for assigning, labelling or closing an issue.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-bd33dd1
  text: A company checks the reference entry for one operation of a policy tool, reading its usage line,
    sample invocations, and every flag with its default, such as batch size and worker count.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-e2b49a9
  text: A team whose database cluster is misbehaving reads what facts to gather about their setup, which
    helper utilities to have ready, and initial steps for getting a status overview and report before
    attempting repairs.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-d0fbf47
  text: A person whose voice app claims to be damaged on launch, or whose background server won't run
    because a port is taken, finds the fix for each issue and learns one warning is harmless.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-683eea5
  text: A developer whose shell says the issue-tracking tool cannot be found, or reports an older version
    than expected, follows fixes such as adjusting the search path and removing a stale copy.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-1f81106
  text: A company whose backup checks return failures or warnings uses status and server overview tools
    to dig into what is wrong with a database server's backup setup.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-60b8ab2
  text: A group running a self-hosted storage cluster sees uploads of very large files stall and eat processor
    time, and finds this recorded as a design limitation with a workaround of using bigger blocks.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-6cff364
  text: A team's monitoring dashboard reports node agent targets failing as unauthorized, and they learn
    which token authentication and authorization flags to switch on so the metrics can be collected.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-97edbb1
  text: A group running a shared storage cluster learns to tell a minor version bump from a major one,
    then updates nodes one at a time after a health check, or plans downtime for bigger jumps.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-1c8f509
  text: A company moving its workflow engine to a later version reads per-version notes on altered behavior,
    like failing containers no longer stopping their siblings and single sign-on accounts being logged
    out once.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-5a2fa9e
  text: A company moving its gateway for web interfaces from an older major line to the new one learns
    that one family of container images is dropped, new deployment modes exist, and its main configuration
    file must be updated.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-b8b394e
  text: A developer moving a memory tool for their coding assistant to a later build syncs and backs up
    data with the old copy beforehand, then puts the new one in place, refreshes hooks and runs data migrations.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-ef5245e
  text: A team moving off an old version of a cluster monitoring bundle reads the breaking updates, such
    as a removed global configuration object, renamed files, and labels that force deleting some resources
    before reapplying.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-47a1784
  text: A person running a managed cluster on a cloud host prepares to move from one major line to the
    next, backing up state, reviewing renamed inputs, and checking the plan destroys nothing unexpectedly.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-2d39484
  text: A developer getting ready to contribute to an open framework for building developer portals reads
    the guide's section on the developer certificate of origin. She attaches a personal certification
    to every saved revision, affirming she may legally offer the work.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-d2c46ee
  text: An organisation maintaining an open gateway for cloud services and ai traffic runs a required
    check. It fails any pull request where a recorded revision lacks a certificate-of-origin trailer,
    and the organisation points people to the matching flag in their version control tool.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-d2d899f
  text: A developer working on a linux distribution built for container clusters uses a flag to add a
    developer certificate of origin statement to every saved revision. She then runs the conformance tests
    that must pass before her contribution is accepted.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-bf5545f
  text: A small team planning a fix for an open monitoring system claims the issue first and runs the
    tests and linters. They attach a developer certificate of origin statement to each revision they push.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-4d70a85
  text: An organisation running a workflow engine for container clusters uses a message hook that rejects
    any recorded revision lacking a developer certificate of origin statement. It also enforces conventional
    titles and requires tests.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-da31784
  text: A pair of volunteers working on an authenticating reverse proxy go through the pull request checklist.
    They tick boxes saying they updated the changelog, wrote tests, used a feature branch and certified
    every revision under the developer certificate of origin.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-d10695f
  text: A developer opens her first pull request to a real-time analytics database. A bot asks her to
    review and accept the project's individual legal contract for outside code before her work can go
    any further.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-b1d4b27
  text: The organisation behind a deep learning library runs an automated check on each new pull request.
    The check fails, with instructions, until the author has put their name to the organisation's legal
    contract for outside code.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-b286b48
  text: A team of developers offering a bug fix to a publishing and newsletter platform learns that contributing
    means accepting a legal contract. The contract gives the platform's foundation broad, irrevocable
    permission to use their work, and their employer must allow the bug fix.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-d79ec9e
  text: A developer who wants to improve a markup-aware prose linter reads the contribution guide. She
    finds a section on a legal contract covering contributions, which she must accept before her pull
    request can be taken.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-030b3b4
  text: A company whose staff want to offer code to an open messaging broker first makes sure it has put
    its name to the project's legal contract for outside code. It then presents the idea to the core team
    before forking.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-32aa5f6
  text: A company building open observability tools for ai agents has a bot ask each newcomer to accept
    its legal contract on their first pull request. The contract lets the company use their work, and
    this one-time step must come before merging.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-e8b22cd
  text: A developer offering a fix to a terminal tool that searches folders recursively finds only one
    contribution rule, which is to follow its ai policy. The project accepts the fix with no certifying
    statement or legal contract.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-59f2e9a
  text: A group of volunteers wants to add a feature to a real-time message server. The guide asks them
    to follow the code of conduct and discuss the idea first, and the project accepts the feature with
    no certifying statement or legal contract.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-8763873
  text: A team contributing to a framework for evaluating agents must show they understand their code
    and write their own descriptions. The project accepts their revisions with no certifying statement
    or legal contract.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-396a96a
  text: A developer proposing a new feature to a self-hosted network control server must write a design
    document, add tests and help maintain the feature. The project accepts the feature with no certifying
    statement or legal contract.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-0df6afe
  text: A developer improving a tool that scans web interfaces for performance problems runs the checks
    and end-to-end tests, adds a changeset and opens a pull request. The project accepts the pull request
    with no certifying statement or legal contract.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-289c56b
  text: A company that maintains an open project management platform asks helpers for clear issue titles
    and minimal reproductions. The company accepts revisions from helpers with no certifying statement
    or legal contract.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-4de88f9
  text: A company behind an editor add-on that offers a whole crew of artificial intelligence coding helpers
    has locked its code store for good. No one can file problems or submit edits there, and no new versions
    will come.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-183ae58
  text: A software organisation declares the old desktop edition of its free bookkeeping program finished
    and freezes its code store so nothing can be altered. It points users to a newer replacement and takes
    no reports, edits or new versions there.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-9ce5635
  text: A team that looked after a traffic-routing controller for container clusters has retired it and
    locked the code store. Existing setups keep working, but no new versions, bug fixes or security patches
    will ever come.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-a281e1a
  text: A company has stopped looking after its freely licensed file storage server and frozen the code
    store. It now points users to a free standalone edition or a paid one, and it takes nothing new and
    ships no further versions.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-80433e5
  text: A writer uses a command-line checker that turns her team's writing guidelines into automatic checks
    on her drafts. She can file bug reports and propose fixes, and its owners keep shipping new versions.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-f7d9c2e
  text: A household blocks ads for every device on its home network using a small computer it owns. They
    keep installing the new versions the ad blocker's makers put out, and they can report problems or
    offer fixes.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-f048f55
  text: A person uses a terminal tool that runs several sessions in one screen and keeps them going in
    the background. Its makers keep putting out new versions, and he can report problems or submit fixes.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-fbea791
  text: A company runs a public platform for tracing and testing large language model apps. It welcomes
    bug reports and feature ideas from users, and it keeps shipping new versions.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-b2d9ab4
  text: A group runs its own control server for a private mesh network so it doesn't depend on a hosted
    service. They pick each new tagged version as it comes out, and they can raise problems or offer fixes.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-3031673
  text: A person uses a small, fast shell prompt that shows the state of her code branch. She can report
    bugs and suggest improvements, and its makers keep putting out new versions.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-3602065
  text: A team tracks the health of its servers with a free monitoring system that keeps time-based data.
    The project takes their reports and proposed fixes, and new versions keep arriving.
  field: code-repository
  tags: {kind: finding, who: group}
- id: s-c2c25b7
  text: An organisation offers a freely licensed whiteboard for shared, encrypted sketches that look hand-drawn.
    It warmly invites outside contributions and keeps putting out new versions.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-89b46e9
  text: An organisation offers a free tool that shows teams what their container clusters and cloud services
    cost. It accepts bug reports and proposed fixes, and it keeps putting out new versions.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-cab1fcd
  text: The developer behind a prose-checking linter composes the announcement for a new version in their
    own words. They explain that faulty rules used to pass silently, describe how a new rule-testing command
    fixes that, and include a sample rule.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-03c3116
  text: The author of a minimal shell prompt composes each version's changelog personally. Every entry
    is a short plain fix, such as for the prompt symbol, the terminal heading or the background fetch,
    followed by a reference code.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-78aab09
  text: A company making an operating system for container clusters composes its own announcement for
    each new version. It welcomes readers, explains why read-only users lose access to a time-checking
    feature, and lists updated component versions.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-12e4975
  text: A developer who runs a large language model on laptops personally composes a short announcement
    for a new version. It explains that compiling failed without an interface plugin, describes the fixes,
    and names the toolchain versions they checked.
  field: code-repository
  tags: {kind: finding, who: one}
- id: s-ff99119
  text: The company behind a queue server composes a maintenance update announcement itself. It urges
    readers to study an earlier version's summary, warns that nodes won't start on older runtimes, and
    explains each bug fix in full sentences.
  field: code-repository
  tags: {kind: service, who: organisation}
- id: s-b51d39f
  text: A team making a laptop cleaning app personally composes its changelog in two languages. Friendly
    sentences describe six improvements, such as faster cleanup and a calmer terminal, and they thank
    the people who reported issues.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-016cc89
  text: A team behind a network ad blocker publishes a version summary that is automatically assembled
    from merged pull request names. Each entry credits its author with a link, newcomers are listed after,
    and nobody alters the summary.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-f35c942
  text: A company with an open platform for tracing language model apps posts a version summary that is
    just an automatically produced list of merged request names. Entries sit under a features heading
    with authors credited, and nobody alters the list.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-df105a2
  text: A developer looking after a small database migration utility publishes a new version. The announcement
    is just the automatically compiled list of merged pull request headings, many of them dependency bumps
    from a bot, and nobody rewrites or adds to the announcement.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-e8cb37b
  text: The team behind a small real-time push server composes a brief update summary in its own words.
    It mentions a stricter security check for creating users, a new settings page, a crash fix and updated
    dependencies.
  field: code-repository
  tags: {kind: service, who: group}
- id: s-9042d10
  text: The developer behind a terminal-based data processor composes each version's changelog personally.
    They describe every new operator and fix in plain words and thank the helper behind each item by name.
  field: code-repository
  tags: {kind: creation, who: one}
- id: s-78543d3
  text: An organisation making free accounting software publishes a version whose summary comes straight
    from merged request names. Automation lists each entry with its author and link and mentions a newcomer,
    and nobody rewrites anything.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-079d3ac
  text: A team making a publishing and newsletter platform posts a version summary that is automatically
    assembled from its recorded code updates. Each entry has an emoji, a short label and the author's
    name, and nobody revises the list.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-eeb06ed
  text: The developer behind a notification library lets automation list the merged work for a small update.
    Above that list, they add a personal paragraph explaining that serious problems after the big version
    prompted this quick follow-up.
  field: code-repository
  tags: {kind: service, who: one}
- id: s-a9ceb18
  text: An organisation behind a cloud cost monitoring project publishes a version whose summary is only
    an automatically produced list of merged request names and authors, plus a newcomer mention. The list
    stays exactly as produced.
  field: code-repository
  tags: {kind: finding, who: organisation}
- id: s-b1e2d18
  text: A team making software that turns code into knowledge graphs personally composes long highlight
    sections. These describe a new design-file analysis mode and a renamed data folder, and sit above
    an automatically produced list of merged work.
  field: code-repository
  tags: {kind: creation, who: group}
- id: s-51346f0
  text: A company with software for running containers in lightweight virtual machines personally composes
    a highlights section, using symbols to mark breaking updates. The automatically produced list of merged
    requests goes below the highlights section.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-d9bab57
  text: A company making an open wiki composes a short highlights list, an enterprise features section
    and a security warning urging upgrades. Underneath, it adds the automatically produced list of merged
    requests.
  field: code-repository
  tags: {kind: creation, who: organisation}
- id: s-13f1c10
  text: An organisation that maintains traffic routing standards for container clusters composes prose
    themes for a pre-final version. They cover features moving to the stable channel and new experimental
