[project]
name = "knowledge-bus"
version = "0.8.0"
description = "Define, inspect, and structurally check shared knowledge expectations"
requires-python = ">=3.14"
dependencies = []
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/SterlingJF/knowledge-bus"
Repository = "https://github.com/SterlingJF/knowledge-bus"

[project.scripts]
kbp = "kbp_conform.cli:run"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbp_conform"]

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
