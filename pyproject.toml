[project]
name = "knowledge-bus"
version = "0.5.0"
description = "Convert a scattered knowledge base into validated specs that agents can consume"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/SterlingJF/knowledge-bus"
Repository = "https://github.com/SterlingJF/knowledge-bus"

[project.scripts]
kbp = "kbp_conform.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbp_conform"]

[dependency-groups]
dev = ["pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]

[tool.hatch.build.targets.wheel.force-include]
"spec/knowledge-bus-protocol.yaml" = "kbp_conform/knowledge-bus-protocol.yaml"
