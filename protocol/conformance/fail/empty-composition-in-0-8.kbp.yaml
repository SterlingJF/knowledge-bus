# kbp/0.8 renamed empty_composition to no_artifact. A kbp/0.8 document using the old name is refused.
universe:
  id: empty-composition-in-0-8
  label: Minimal
  version: 0.1
  conforms_to: kbp/0.8
  ordering_frame: stage

statuses: [conjecture, measured]

frames:
  - id: stage
    code: fa1a1
    role: ordering
    set_by: universe
    attaches_to: element
    values:
      - { id: only, question: "Where in the sequence does this sit?" }

empty_composition:
  when: {}

relation_kinds:
  - { id: informs, ordered: true }

elements:
  - id: the-question
    code: ea1a1
    question: "What is being asked?"
    stage: only
    cardinality: singleton

artifacts:
  - id: the-record
    code: aa1a1
    enablement: "Lets someone state a question and be held to it."
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core:
        - the-question

relations: []
