# A kbp/0.7 edge gate keeps its 0.7 shape, { authority, latency }, and is not checked
# against the universe's frames. This universe declares no authority frame.
universe:
  id: edge-gate-in-0-7
  label: Minimal
  version: 0.1
  conforms_to: kbp/0.7
  ordering_frame: stage

statuses: [conjecture, measured]

frames:
  - id: stage
    code: fa1a1
    role: ordering
    set_by: universe
    attaches_to: element
    values:
      - { id: only, question: "Where in the sequence does this sit?" }
  - id: review
    code: fa1a2
    role: gating
    set_by: scope
    attaches_to: artifact
    values: [light, full]

empty_composition:
  when: {}

relation_kinds:
  - { id: informs, ordered: true }

elements:
  - id: the-question
    code: ea1a1
    question: "What is being asked?"
    stage: only
    cardinality: singleton

artifacts:
  - id: the-record
    code: aa1a1
    enablement: "Lets someone state a question and be held to it."
    alias: { kind: none, reason: no-aligned-form }
    composition:
      core:
        - the-question

relations:
  - { from: the-question, to: the-record, kind: informs, gate: { authority: approve, latency: 2d } }
