# Real situations for the recognition check, shared by every universe and stored once each,
# with the field each comes from and its tags. Of the tags, kind says what the work produces,
# and who is the party whose situation or decision it is, not the other side. Each is a
# de-identified paraphrase of one real public case: no names, places, dates or identifiers, and
# no run of 7 words shared with its source; sources and provenance are kept privately outside
# the repository. Each universe's answers sit beside this file in <universe-id>.yaml. Written
# by tools/evals/intake.py apply.
schema: evals-cases/1
tags:
  kind:
    creation: The result is a made piece, such as an object, building, program or document, whose worth
      lies in the piece itself; it is handed over or put in place and goes on existing after its makers
      step away.
    service: The result is the doing itself, carried out for someone as they receive it, such as care,
      coaching, repair, teaching or transport; once it is done, no new made piece or stated conclusion
      is left to hand over.
    finding: The result is something learned and stated, such as an answer, a measurement, a diagnosis
      or a tested conclusion, whose worth lies in being true and relied on; any document carrying it is
      only the vehicle.
  who:
    one: One person whose situation or decision it is, even when acting in a role, such as a club secretary
      or a council officer.
    group: Several people acting together whose shared situation or decision it is, such as a household,
      a couple, a team, a committee or volunteers, even inside a bigger body.
    organisation: A body acting as itself, such as a company, council, charity, university, school, agency
      or regulator.
cases:
- id: s-1d2f7fa
  text: A home baker wants to find out whether they must register with the local council as a food business
    before selling cakes from their kitchen, how long beforehand, and whether the council can refuse.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-393c6fc
  text: People setting up a new charity want to find out which kinds of purpose the sector regulator recognises,
    and whether the aim must benefit the public, before they can be registered.
  field: product-development
  tags: {kind: service, who: group}
- id: s-8fb5823
  text: A lone open-source maintainer wants to read how others earn a living from their projects, for
    example through ongoing retainer agreements with companies that depend on the code rather than selling
    hours of support.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-8afc9a8
  text: Someone hoping to cook and sell hot meals at a pavement stall wants to find out which council
    licence is required, how many weekdays ahead to apply, and whether offering alcohol requires a separate
    permit.
  field: product-development
  tags: {kind: service, who: one}
- id: s-2935114
  text: A youth homelessness charity wants the written account of the lasting difference it aims to make
    for young people, drawn up after consulting both young people and staff.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-388b8fd
  text: A programming language community wants survey results on why people who have not adopted it have
    held off, why past users left, and what current users worry about.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-8f97f37
  text: A public web team wants research findings on how people cope today with juggling many accounts
    and passwords, and whether they use password managers, before settling on a single account.
  field: product-development
  tags: {kind: service, who: group}
- id: s-30ed9b3
  text: A council wants to learn what residents who never use libraries would want in order to come in,
    after finding that most survey replies came from regular borrowers.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-c8c6632
  text: A county wants to find out how many older residents often feel lonely and which groups face extra
    barriers, before deciding which services to commission.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-eae350d
  text: A solo founder wants to find out what people already use and pay for to manage their tasks, and
    whether the problem is real, rather than only asking whether they would try a new tool.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-646b488
  text: A volunteer park group wants to find out where visitors would like money spent, which events they
    want and how they hear about the park, using a short visitor survey.
  field: product-development
  tags: {kind: service, who: group}
- id: s-99d7942
  text: A contributor to a programming language wants to find out which alternative spellings and rule
    changes were weighed and rejected for a proposed new form of assignment, and how the common objections
    were answered.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-1b77779
  text: A user wants to find out which features a fast bundling tool plans to add, such as better code
    splitting, and which it will leave out of the core, such as type checking, preferring plugins.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-b0ed85a
  text: A writer for a public service wants the rules for wording its content, such as keeping legal text
    in everyday language and adding a plain summary whenever jargon must be published.
  field: product-development
  tags: {kind: service, who: one}
- id: s-f06513d
  text: A package-manager contributor wants to find out how another language's tooling coped with the
    same index growth step by step, and which matters about setting an index's fetch method remain unsettled.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-14187eb
  text: A team wants to find out why an online service for teachers trained abroad offers simple sign-in
    rather than an identity-check journey, given that many applicants lack the documents the checks need.
  field: product-development
  tags: {kind: service, who: group}
- id: s-4e0e4d1
  text: A trial team wants to find out why the study assigns whole areas instead of individual couples
    to a programme, accepting lower statistical power so that nobody in one area gets both versions.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-fba5932
  text: A service team wants to find out how the share of people who finish an online transaction is counted,
    including assisted completions, and when a transaction counts as failed.
  field: product-development
  tags: {kind: service, who: group}
- id: s-0f2ba4a
  text: 'A freelance site builder wants the thresholds for a good page experience: how fast the main content
    must appear, how quickly the page must react, how little the layout may shift, and across what share
    of visits.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-9abd39d
  text: A doctor running a school trial wants to find out how the main outcome, weekly physical activity,
    is gathered by questionnaire and converted into standard energy units.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-794a6f9
  text: A council officer wants the target for reported missed bin collections per number of collections,
    the level counted as good, and the latest monthly reading against it.
  field: product-development
  tags: {kind: service, who: one}
- id: s-ed89100
  text: A contributor to a scientific code project wants to find out how much slower than a stored baseline
    a typical run may get before the automated speed check fails, and how noisy the runs are.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-c44d389
  text: A repair-café group wants to find out how the emissions saved per completed repair and the repair
    success rate are calculated from records of attempted repairs.
  field: product-development
  tags: {kind: service, who: group}
- id: s-d3462ba
  text: A user of a government messaging service wants its target for how fast most messages are sent,
    and which things, such as whether emails are opened, it does not measure.
  field: product-development
  tags: {kind: service, who: one}
- id: s-6876e4f
  text: 'A new contributor wants a map of the pieces of a code-editor helper: where it starts, which piece
    replies to editor requests, and how analysis is recomputed lazily when one file is edited.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-9e2c6aa
  text: 'A developer wants to read how a bundler''s two main phases divide the job: locating every required
    module in parallel from the entry files, then compiling and linking them into the final bundle.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-41a65eb
  text: 'A volunteer wants to understand how a food bank is organised: donations go to a warehouse, volunteers
    stock distribution centres from it, and partner agencies assess people in crisis and issue electronic
    vouchers exchanged for a few days of food.'
  field: product-development
  tags: {kind: service, who: one}
- id: s-89950dd
  text: 'A newcomer to a container platform wants to find out what it does not do: it neither compiles
    applications from source nor ships built-in middleware, and many pieces are optional and pluggable.'
  field: product-development
  tags: {kind: creation, who: one}
- id: s-e77ed0a
  text: 'A wildlife recorder wants to find out how sightings travel: records stay on the website unless
    an expert verifier checks them, and depending on who verifies may also pass to a national society''s
    database or a local records centre.'
  field: product-development
  tags: {kind: finding, who: one}
- id: s-a2e7a6d
  text: A statistician wants to find out how a national statistics office sorts jobs into nested groups,
    from broad major groups down to unit groups, by skill level and specialisation.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-59554ee
  text: 'The owner of a small cafe wants a pack of routines for a food business: opening and closing checks,
    staff training records, a daily diary and a periodic review.'
  field: product-development
  tags: {kind: service, who: one}
- id: s-7356094
  text: A user wants to find which supported release lines a language project has, who manages each, whether
    each still gets bug fixes or only security fixes, and when each reaches end of life.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-8639edc
  text: A government forms service wants to find out how early access is opened to more organisations
    after a first group of private-beta partners, with a yearly cap on submissions per form.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-6c8c625
  text: 'A new on-call engineer wants the guide on what to do when paged: keep a laptop and connection
    to hand, expect escalation within minutes, and judge whether an alert needs action now or can wait
    until morning.'
  field: product-development
  tags: {kind: service, who: one}
- id: s-ae842cf
  text: 'A village hall committee wants the routine safety checks that keep the hall running: recorded
    regular inspections of paths, lighting, escape routes and ladders, recorded training, and a yearly
    fire review.'
  field: product-development
  tags: {kind: service, who: group}
- id: s-ed195cc
  text: 'A small-business owner wants to find out what a freelance developer''s maintenance service covers
    after launch: routine updates, regular backups, monitoring and priority help when something breaks.'
  field: product-development
  tags: {kind: service, who: one}
- id: s-2acd52b
  text: Two developers spend a week writing a crude throwaway program just to see whether an approach
    can work, expecting to delete it once it answers the question, though now and then one is kept.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-73ea1bf
  text: A programmer explains their code line by line aloud to a rubber duck on the desk and spots the
    bug mid-sentence; nothing is written down.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-6397b15
  text: A learner tries out database commands in an online sandbox that wipes its data when the temporary
    run expires, though a short history of queries lingers until they clear it.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-d8dd03f
  text: Someone opens a disposable virtual desktop to see what an untrusted program does, and everything
    is wiped when they close the window.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-af6c1e8
  text: A product team mocks up a rough app screen flow to get early stakeholder feedback, having agreed
