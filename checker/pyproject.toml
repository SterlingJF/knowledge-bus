[project]
name = "knowledge-bus"
version = "0.7.0"
description = "Convert a scattered knowledge base into validated specs that agents can consume"
requires-python = ">=3.14"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/SterlingJF/knowledge-bus"
Repository = "https://github.com/SterlingJF/knowledge-bus"

[project.scripts]
kbp = "kbp_conform.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbp_conform"]

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
