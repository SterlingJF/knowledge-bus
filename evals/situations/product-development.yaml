    means:
      reversible: The move can be taken back quickly and cheaply, leaving things much as they were, so
        trying it and backing out is nearly free.
      costly: The move can still be taken back, but only by losing real money, time, effort or goodwill
        along the way.
      irreversible: Once done, the move cannot be taken back at any price, because what it changed or
