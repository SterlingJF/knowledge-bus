  maturity:
    ladder: true
    fingerprint: sha256:fe7ccde3239c1138
    means:
      unproven: There is no real evidence yet that the main premise behind the effort holds for those
        it is for; it is still a guess, being tested or not yet tried.
      proven: Real use with people like those it is for has shown the main premise holds, and the effort
        is repeating or refining it at about that size.
      scaling: With the premise already shown to hold, the effort is now deliberately widening its reach
        well beyond the size at which that was shown, to many more users, places or volume, and keeping
        it sound as it grows.
