# Workspace orchestration only; the installable distribution lives in checker/.
[tool.uv.workspace]
members = ["checker"]

[tool.uv.sources]
knowledge-bus = { workspace = true }

[dependency-groups]
dev = ["knowledge-bus", "pytest>=8.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["checker/tests", "tools/release", "tools/plugin"]

[tool.ruff]
target-version = "py314"
src = ["checker/src"]
# Check authored sources rather than generated copies bundled with skills.
extend-exclude = ["skills/*/runtime", "skills/*/references"]
force-exclude = true
