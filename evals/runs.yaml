# The runs behind evals/report.md, one entry per run:
#
#   - side: anthropic         # anthropic or openai
#     id: <run-id>            # the name of the run folder, as in universe-20261009T151853022707Z
#     universe: <universe-id>   # for a run that graded a universe (run.json names it when recorded)
#
# Each run id ends with the run's UTC timestamp; universe-20261009T151853022707Z ran on 2026-10-09.
# The maintainers keep the run folders of the listed runs dated 2026-10-09 or earlier.
# A side lists at most one run per measure, and per universe for the universe grade, recognition
# and sorting; the report keeps one section per universe and never compares across universes.
# A run's judge, light, filer and agent models must belong to its side's company (codex:<model>
# on the openai side, any other name on the anthropic side); Jev serves both sides.
# `just evals-report` writes evals/report.md from the committed summaries in evals/results/.
# To add a run, list its id here and run `just evals-report --run-folders <folder>`: report.py
# summarises each listed run from the folder named for its run id at any depth under <folder>,
# and a run with no folder there keeps its committed summary. Commit evals/results/ and
# evals/report.md with this file.
runs:
