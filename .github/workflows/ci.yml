name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_MANAGED_PYTHON: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/quality/lane.mjs "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  checks-static:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - uses: extractions/setup-just@v4
      - run: pnpm run check:fast
      - run: pnpm run check:plugins
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: pnpm run test
      - run: pnpm run check:explorer:gallery
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: uv run --locked python tools/plugin/check_skills_install.py
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: uv run kbp --validate
      - run: uv run --locked python tools/plugin/check_native_install.py
        if: ${{ needs.changes.outputs.lane == 'code' }}

  explorer-unit:
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'code' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:explorer:unit

  explorer-browser:
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'code' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm run test:explorer:adapter
      - run: pnpm run build:explorer
      - run: pnpm run render:explorer
      - run: pnpm run test:explorer:browser
      - run: pnpm run check:explorer:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: explorer
          path: dist/explorer/
          if-no-files-found: error

  explorer-shots:
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'code' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm run build:explorer
      - run: pnpm run render:explorer
      - name: Capture KB Explorer snapshots
        run: pnpm run capture:explorer:step
      - uses: actions/upload-artifact@v7
        with:
          name: explorer-shots-step
          path: dist/explorer-shots/step/
          if-no-files-found: error

  checks:
    needs: [changes, checks-static, explorer-unit, explorer-browser, explorer-shots]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every check lane to pass, or to skip on a copy-only change
        env:
          LANE: ${{ needs.changes.outputs.lane }}
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.checks-static.result }}" = success
          for result in "${{ needs.explorer-unit.result }}" "${{ needs.explorer-browser.result }}" "${{ needs.explorer-shots.result }}"; do
            test "$result" = success || { test "$LANE" = copy && test "$result" = skipped; }
          done

  native-hosts:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, pi, opencode]
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - uses: actions/setup-node@v7
        if: ${{ needs.changes.outputs.lane == 'code' }}
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - uses: astral-sh/setup-uv@v10.1.0
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: uv python install
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: uv sync --locked
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: ${{ needs.changes.outputs.lane == 'code' }}
      - name: Install pinned native CLIs in the disposable runner
        if: ${{ needs.changes.outputs.lane == 'code' }}
        run: npm install --global @anthropic-ai/claude-code@2.1.226 @openai/codex@0.149.0 @earendil-works/pi-coding-agent@0.85.1 opencode-ai@1.18.20
      - name: Build host fixture and test native commands
        if: ${{ needs.changes.outputs.lane == 'code' }}
        env:
          TEST_HOST: ${{ matrix.host }}
        run: |
          uv run --locked python tools/plugin/plugin.py check "$TEST_HOST" --output "$RUNNER_TEMP/host-package"
          uv run --locked python tools/plugin/check_host_cli.py --host "$TEST_HOST" --artifacts "$RUNNER_TEMP/host-package"
