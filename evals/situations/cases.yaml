  field: product-development
  tags: {kind: creation, who: group}
- id: s-9fc531c
  text: A scholar keeps a personal box of linked notes, writing down why each link was made because months
    later they will have forgotten, and nobody else is meant to use it.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-18f690b
  text: A home gardener logs soil tests, pests, plantings and spending in a binder each season, to decide
    what to do in later years.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-1fb74ea
  text: A student keeps a research log of where they searched, which keywords worked and how each source
    might be used, so nothing is lost by the time they write up.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-428b4a0
  text: A developer keeps a private file of fixes they have worked out, so that when the same problem
    comes back they can look up their own earlier answer.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-0b46f4e
  text: At the end of each stretch of writing, a graduate writer leaves themselves notes on next steps
    for when they come back to it.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-5017099
  text: Someone who makes weighty decisions, such as whether to add staff, keeps a personal journal of
    each one, noting what they weighed, what they expected and how sure they were, and rereads it every
    few months to see how their own judgement held up.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-85e2388
  text: An outgoing club officer writes a few pages for their successor on the weekly routine, unfinished
    jobs, coming deadlines and the logins, because the role will outlast them.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-269351f
  text: A household talks through how they will get alerts, where they will shelter, which way they will
    leave and how they will reach each other, and keeps the plan for everyone at home.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-a422961
  text: After a major outage, a company's engineers write a blameless review, have senior colleagues check
    it and file it in an internal archive of past incidents for other staff to learn from.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-2f592bf
  text: At shift change, outgoing ward nurses pass each patient's situation, background, assessment and
    recommendation to the incoming nurses using a standard handover format.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-5dbe19c
  text: A software team writes each significant design decision with its context and consequences in a
    short record, so that someone joining later does not have to accept or reverse it blindly.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-168d0b6
  text: An operations team writes step-by-step runbooks for recurring jobs and incidents so newcomers
    can follow them and old hands can refresh their own memory.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-2b53bc9
  text: A student in a university lab keeps the experiment notebook neat and legible for others, because
    it belongs to the research group rather than to them, and at the end of term signs it and hands it
    to the supervisor so the group can replicate and troubleshoot the work later.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-31eb4b6
  text: A volunteer club secretary takes minutes of each committee meeting so later committees know what
    was decided, and keeps them for years because a regulator or a dispute may one day call for them.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-610ef8f
  text: A drug trial's sponsor must keep the essential trial files and participants' records for decades
    so that regulators and auditors can later check how the trial was run.
  field: product-development
  tags: {kind: finding, who: organisation}
- id: s-fbaf3fc
  text: A web designer finishing a customer's website hands over a document with the logins, a project
    summary and special instructions, which the customer, and later staff unfamiliar with the project,
    can keep on hand and refer back to.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-ec71e15
  text: An aircraft owner must keep maintenance and inspection records, some of which go with the plane
    when it is sold, so a later owner and any inspector can see its history.
  field: product-development
  tags: {kind: service, who: one}
- id: s-253bf3e
  text: A sole trader keeps income and expense records for years after each tax deadline, because the
    tax office may one day check them, though it may never do so.
  field: product-development
  tags: {kind: service, who: one}
- id: s-f7a1f15
  text: A researcher registers the hypotheses and analysis plan before seeing the data, so readers of
    the eventual paper can tell planned tests from exploratory ones; the registration becomes public after
    any embargo.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-a94599e
  text: A research team depositing a dataset in a public repository writes a file-by-file description
    and commented scripts so that researchers they will never meet can reanalyse it.
  field: product-development
  tags: {kind: finding, who: group}
- id: s-c7f0e43
  text: A programming-language community keeps its design proposals as public documents under version
    control, so their revision history serves as the record of each feature for anyone who looks later.
  field: product-development
  tags: {kind: creation, who: group}
- id: s-2f38532
  text: A researcher spots a mistake in a paper sent to a preprint server before it has been publicly
    listed, so the paper goes to draft, the files are corrected and it is submitted again; nothing public
    ever showed the flawed version, and the only effect is a slightly later listing.
  field: product-development
  tags: {kind: finding, who: one}
- id: s-7127c05
  text: A blogger changes a page, dislikes the result and returns to the earlier saved version with one
    button press, because the site keeps every previous version of the page.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-8633a6a
  text: The operators of a busy online shop switch off a non-essential panel on the home page during a
    traffic surge and switch it on again afterwards, with nothing lost in between.
  field: product-development
  tags: {kind: service, who: group}
- id: s-ed8de4b
  text: A self-published author notices a typo in a book that has been on sale for months and uploads
    a corrected file, which the print-on-demand distributor now accepts as often as wanted without any
    fee.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-8583047
  text: A government office that posts letters in a batch printed each afternoon lets a department call
    off a letter at any point before the print run; a letter cancelled in time is never printed or posted.
  field: product-development
  tags: {kind: service, who: organisation}
- id: s-59bd7a6
  text: A food producer finds unsafe products already in shops and has to pull them from shelves, tell
    customers and notify the authorities, paying in staff time, money and shoppers' trust.
  field: product-development
  tags: {kind: creation, who: organisation}
- id: s-441f5d2
  text: Someone who withdraws a council planning application gets no fee refunded, and putting in a fresh
    application means paying again, plus more time from the consultants who prepared the reports.
  field: product-development
  tags: {kind: creation, who: one}
- id: s-4b5e086
  text: A team wants a file removed from its shared code history, which means rewriting that history,
